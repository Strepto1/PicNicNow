[project]
name = "picnicnow"
version = "0.1.0"
description = "Gespreksgestuurde boodschappenhulp voor Picnic: weekmenu, boodschappenlijst, babyhapjes, bio en aanbiedingen."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-picnic-api2>=2.0.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
picnicnow = "picnicnow.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["picnicnow*"]

[tool.setuptools.package-data]
picnicnow = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
